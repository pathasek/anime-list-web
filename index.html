<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anime List</title>
<style>
  :root {
    color-scheme: dark light;
    --pozadi: #121216;
    --karta: #17171d;
    --okraj: #3b3a42;
    --text: #ebebeb;
    --text2: #b9b7c2;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --pozadi: #faf5ff;
      --karta: #ffffff;
      --okraj: #e2d5f0;
      --text: #1e1b2e;
      --text2: #6b5f7c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--pozadi);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 32px 28px;
    background: var(--karta);
    border: 1px solid var(--okraj);
    border-radius: 16px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 1.375rem; font-weight: 700; }
  p { margin: 0 0 12px; color: var(--text2); }
  p:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<main>
<h1>Web se přestěhoval</h1>
<p>Anime List je teď soukromý a přístupný jen s osobním odkazem.</p>
<p>O odkaz si řekni Patrikovi.</p>
</main>
</body>
</html>
